# 블로그의 실제 페이지에서 받는 배포용 덮어쓰기. lab 의 compose.yaml 위에 겹쳐 쓴다.
# 사용(cwv-otel-grafana 에서): cp deploy/env.example .env && docker compose -f compose.yaml -f deploy/compose.yaml up -d
services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      - OTEL_DOMAIN=${OTEL_DOMAIN:?}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80" # 인증서 발급(HTTP-01)
      - "443:443"
    depends_on:
      - collector

  collector:
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/deploy.yaml"]
    environment:
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:?}
    volumes:
      - ./deploy/collector.yaml:/etc/otelcol/deploy.yaml:ro
    ports: !reset []

  tempo:
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    environment:
      - TEMPO_RETENTION=${TEMPO_RETENTION:-8760h}
      - TEMPO_QUERY_RANGE=${TEMPO_QUERY_RANGE:-8760h}
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo.yaml:ro
    ports: !reset []

  mimir:
    restart: unless-stopped
    command: ["-config.file=/etc/mimir.yaml", "-compactor.blocks-retention-period=${MIMIR_RETENTION:-0}"]
    ports: !reset []

  grafana:
    restart: unless-stopped
    # 익명 접근과 로그인 폼 끄기를 모두 지운다. SSH 터널로만 연다.
    environment: !override
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?}
    ports: !override
      - "127.0.0.1:3000:3000"

volumes:
  caddy-data:
