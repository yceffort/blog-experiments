name: cwv-otel-grafana
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318" # OTLP/HTTP (브라우저가 여기로 보낸다)
      - "8888:8888" # collector 자체 메트릭
    depends_on:
      - tempo
      - mimir

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  mimir:
    image: grafana/mimir:3.2.2
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir.yaml:ro
      - mimir-data:/data
    ports:
      - "9009:9009"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - mimir

volumes:
  tempo-data:
  mimir-data:
