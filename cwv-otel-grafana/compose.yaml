name: cwv-otel-grafana
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP (브라우저가 여기로 보낸다)
      - "127.0.0.1:8888:8888" # collector 자체 메트릭
    depends_on:
      - tempo
      - mimir

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  mimir:
    image: grafana/mimir:3.2.2
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir.yaml:ro
      - mimir-data:/data
    ports:
      - "127.0.0.1:9009:9009"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - tempo
      - mimir

  # 브라우저 보고를 측정마다 최신값으로 모아 30분 동안 갱신이 없으면 확정하고, 누적 히스토그램으로 collector 에 보낸다.
  gateway:
    image: node:24.20.0-alpine
    command: ["node", "/lab/gateway/server.mjs"]
    environment:
      - OTLP_URL=http://collector:4318/v1/metrics
      - FINALIZE_MS=1800000
      - HOST=0.0.0.0
      - STATE_FILE=/data/finalized.json
    volumes:
      - ./gateway:/lab/gateway:ro
      - gateway-data:/data
      - ./demo-web/src/telemetry/buckets.ts:/lab/demo-web/src/telemetry/buckets.ts:ro
    ports:
      - "127.0.0.1:4320:4320" # 브라우저 보고(POST /v1/vitals)
    depends_on:
      - collector

volumes:
  tempo-data:
  mimir-data:
  gateway-data:
