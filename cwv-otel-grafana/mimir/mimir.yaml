# 로컬 실험용 단일 프로세스 설정. 운영에 쓰지 않는다.
# multitenancy 는 기본값(켜짐)으로 두고 X-Scope-OrgID 로 테넌트를 고른다.
target: all

blocks_storage:
  backend: filesystem
  bucket_store:
    sync_dir: /data/tsdb-sync
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules

store_gateway:
  sharding_ring:
    replication_factor: 1

server:
  http_listen_port: 9009
  log_level: warn

usage_stats:
  enabled: false
